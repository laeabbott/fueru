name: build

# Minimal CI, deliberately not a full pipeline: this is a personal, never-shipped-publicly app
# with no team and no release automation to protect. The one thing worth catching automatically
# is "does it even compile" -- a build break otherwise isn't visible until installed on-device.
# USDA_API_KEY/GIPHY_API_KEY come from a gitignored local.properties and default to empty strings
# in app/build.gradle.kts, so no secrets are needed for this job to succeed.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
