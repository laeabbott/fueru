name: build

# Minimal CI, deliberately not a full pipeline: this is a personal, never-shipped-publicly (to the
# Play Store) app with no team to protect against merge chaos. The things worth catching
# automatically are "does it even compile," "do the unit tests still pass," and "any new lint
# errors" -- a build break otherwise isn't visible until installed on-device.
# USDA_API_KEY/GIPHY_API_KEY come from a gitignored local.properties and default to empty strings
# in app/build.gradle.kts, so no secrets are needed for this job to succeed.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # In-app-update round -- publishes a GitHub Release with a real, versioned, consistently-signed
  # APK on every push to master, so the in-app "check for updates" (Settings > About & Updates)
  # always has something real to find. Only runs after `build` passes, and only for master itself
  # -- a PR branch build isn't something that should ever land in front of the phone's update
  # checker. Release tag is v<run number>, matching AppUpdateChecker.kt's integer-only comparison
  # against BuildConfig.VERSION_CODE (no semver parsing needed) -- always-increasing, no manual
  # version bump ever required.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build versioned APK
        run: ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }} --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "v${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}"
